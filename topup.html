<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAOMI💜STORE — Top Up</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;background:#0e0618;color:#fff;line-height:1.5}header{background:linear-gradient(135deg,#210034,#7517bd,#b44cff);padding:16px 18px;position:sticky;top:0;z-index:20}.nav{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.logo{font-size:21px;font-weight:900}nav{display:flex;gap:7px;flex-wrap:wrap}nav a{color:#fff;text-decoration:none;padding:9px 11px;border-radius:9px;background:#ffffff12;font-size:13px;font-weight:800}main{max-width:1100px;margin:auto;padding:28px 18px 60px}.hero{padding:42px 25px;border-radius:22px;background:linear-gradient(135deg,#1b0b2a,#41105f,#7517bd);border:1px solid #a94bdf66;margin-bottom:22px}.hero h1{font-size:38px;line-height:1.1;margin-bottom:10px}.hero p,.muted{color:#b9abc4}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.card{background:#1b0b2a;border:1px solid #8f39c966;border-radius:17px;padding:19px}.card h2{color:#e0b2ff;margin-bottom:7px}.btn{display:inline-block;margin-top:13px;padding:12px 15px;border-radius:10px;background:linear-gradient(135deg,#8e24d9,#c65cff);color:#fff;text-decoration:none;font-weight:900;border:0;cursor:pointer}.price{font-size:22px;font-weight:900;margin-top:10px}.package{display:flex;align-items:center;justify-content:space-between;gap:12px}input,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #68427c;background:#10051d;color:#fff;margin-top:6px}label{display:block;font-weight:800;margin-top:12px}.account img{width:100%;height:170px;object-fit:cover;border-radius:11px}.badge{display:inline-block;padding:4px 9px;border-radius:20px;background:#2c8a52;font-size:11px;font-weight:900;margin-bottom:8px}.empty{text-align:center;padding:35px;color:#9e91a8;border:1px dashed #ffffff20;border-radius:14px}footer{border-top:1px solid #ffffff15;padding:25px 18px;color:#9e91a8;text-align:center}.notice{background:#24102f;border:1px solid #ffffff18;padding:13px;border-radius:12px;margin-bottom:18px}@media(max-width:650px){.hero h1{font-size:30px}.logo{width:100%}}</style></head><body><header><div class="nav"><div class="logo">NAOMI💜STORE🛒🛍️</div><nav><a href="index.html">HOME</a><a href="topup.html">💎 TOP UP</a><a href="accounts.html">🎮 ACCOUNTS</a><a href="swap.html">🔄 SWAP</a><a href="categories.html">📂 CATEGORIES</a><a href="contact.html">📞 CONTACT</a></nav></div></header><main><section class="hero"><h1>💎 Diamond Top Up</h1><p>Select a diamond package below.</p></section><div id="packages" class="grid"></div></main><footer>NAOMI💜STORE🛒🛍️<br><small>Free Fire services & account marketplace</small></footer><script>const D='naomi_store_diamonds_v1',A='naomi_store_accounts_v1',C='naomi_store_categories_v1',WA='2348082342411';
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function money(v){return '₦'+Number(String(v).replace(/[^0-9]/g,'')||0).toLocaleString('en-NG')}
function wa(s){return 'https://wa.me/'+WA+'?text='+encodeURIComponent(s)}
function diamonds(){return JSON.parse(localStorage.getItem(D)||'null')||[{amount:'100',price:'1550'},{amount:'310',price:'4450'},{amount:'520',price:'7350'},{amount:'1060',price:'14600'},{amount:'2180',price:'29100'},{amount:'5600',price:'72600'}]}
function accounts(){return JSON.parse(localStorage.getItem(A)||'null')||[]}
function cats(){return JSON.parse(localStorage.getItem(C)||'null')||[{name:'Free Fire Accounts',description:'Browse available Free Fire accounts.'},{name:'UID Top-Up',description:'Free Fire diamond top-up packages.'},{name:'Account Swap',description:'Submit an account swap request.'}]}document.getElementById('packages').innerHTML=diamonds().map(x=>`<div class="card"><h2>${esc(x.amount)} Diamonds</h2><div class="price">${money(x.price)}</div><p class="muted">UID top-up</p><a class="btn" href="${wa('Hello NAOMI STORE, I want '+x.amount+' Diamonds for '+money(x.price)+'. My UID is: ')}">ORDER ON WHATSAPP</a></div>`).join('');</script></body></html>
